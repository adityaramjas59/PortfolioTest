        /* ==========================================================================
           1. CSS VARIABLES & RESET
           ========================================================================== */
        :root {
            --primary: #2563eb;         /* Crisp modern blue */
            --primary-hover: #1d4ed8;   /* Darker blue hover */
            --bg-main: #f8fafc;         /* Soft slate background */
            --bg-card: #ffffff;         /* Pure white cards */
            --text-main: #0f172a;       /* Deep slate primary text */
            --text-muted: #475569;      /* Muted secondary text */
            --border-color: #e2e8f0;    /* Subtle border treatment */
            --badge-bg: #eff6ff;        /* Light blue accent for tags */
            --badge-text: #1e40af;      /* Dark blue text for tags */
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            --radius: 8px;
            --max-width: 1024px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: var(--primary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: var(--primary-hover);
        }

        /* ==========================================================================
           2. LAYOUT & CONTAINERS
           ========================================================================== */
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        section {
            padding: 4.5rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        section:last-of-type {
            border-bottom: none;
        }

        .section-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 2rem;
            letter-spacing: -0.025em;
        }

        /* ==========================================================================
           3. STICKY NAVIGATION
           ========================================================================== */
        .navbar {
            position: sticky;
            top: 0;
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 4rem;
        }

        .nav-logo {
            font-weight: 700;
            font-size: 1.125rem;
            color: var(--text-main);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        .nav-links a {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.95rem;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* ==========================================================================
           4. HERO / HEADER SECTION
           ========================================================================== */
        .hero {
            padding: 5rem 0 4rem;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
        }

        .hero-content {
            max-width: 800px;
        }

        .hero-title {
            font-size: 2.75rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        .hero-tagline {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-weight: 400;
        }

        .hero-cta {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }
